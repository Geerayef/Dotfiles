[buildPlans.Ioskeley]
family = "Ioskeley"
spacing = "term"
serifs = "sans"
noCvSs = false
exportGlyphNames = true

[buildPlans.Ioskeley.variants.design]
one = "no-base"
two = "straight-neck-serifless"
three = "flat-top-serifless"
four = "open-non-crossing-serifless"
five = "upright-flat-hook-serifless"
six = "closed-contour"
seven = "straight-serifless"
eight = "two-circles"
nine = "closed-contour"
zero = "dotted"
capital-a = "straight-serifless"
capital-b = "standard-serifless"
capital-c = "bilateral-inward-serifed"
capital-d = "standard-serifless"
capital-e = "serifless"
capital-f = "serifless"
capital-g = "toothless-corner-inward-serifed-hooked"
capital-h = "serifless"
capital-i = "serifed"
capital-j = "serifless"
capital-k = "symmetric-touching-serifless"
capital-l = "serifless"
capital-m = "hanging-serifless"
capital-n = "standard-serifless"
capital-p = "closed-serifless"
capital-q = "crossing"
capital-r = "standing-serifless"
capital-s = "bilateral-inward-serifed"
capital-t = "serifless"
capital-u = "toothless-rounded-serifless"
capital-v = "straight-serifless"
capital-w = "straight-serifless"
capital-x = "straight-serifless"
capital-y = "straight-serifless"
capital-z = "straight-serifless"
a = "double-storey-hook-inward-serifed-flat-bottom-serifless"
b = "flat-bottom-serifless"
c = "bilateral-inward-serifed"
d = "flat-bottom-serifless"
e = "flat-crossbar"
f = "flat-hook-serifless-crossbar-at-x-height"
g = "single-storey-flat-hook-flat-top-serifless"
h = "straight-serifless"
i = "hooky"
j = "flat-hook-serifed"
k = "symmetric-connected-serifless"
l = "hooky"
m = "flat-top-serifless"
n = "flat-top-straight-serifless"
p = "flat-top-serifless"
q = "flat-top-straight-serifless"
r = "flat-top-serifless"
s = "serifless"
t = "flat-hook"
u = "flat-bottom-serifless"
v = "straight-serifless"
w = "straight-serifless"
x = "straight-serifless"
y = "cursive-flat-hook-serifless"
z = "straight-serifless"
lower-theta = "oval"
lower-lambda = "straight-turn"
lower-mu = "toothed-serifless"
tittle = "square"
diacritic-dot = "square"
punctuation-dot = "square"
braille-dot = "square"
ellipsis-density = "dense"
tilde = "low"
asterisk = "penta-high"
underscore = "above-baseline"
caret = "medium"
ascii-grave = "straight"
ascii-single-quote = "straight"
paren = "flat-arc"
brace = "curly-flat-boundary"
guillemet = "straight"
number-sign = "slanted"
ampersand = "closed"
at = "threefold"
dollar = "through"
cent = "through-cap"
percent = "rings-continuous-slash"
bar = "natural-slope"
question = "corner"
pilcrow = "high"
micro-sign = "toothed-serifless"
decorative-angle-brackets = "middle"
lig-ltgteq = "flat"
lig-neq = "slightly-slanted"
lig-equal-chain = "without-notch"
lig-hyphen-chain = "without-notch"
lig-plus-chain = "without-notch"
lig-double-arrow-bar = "without-notch"
lig-single-arrow-bar = "without-notch"

[buildPlans.Ioskeley.ligations]
inherits = "dlig"

# Weights
[buildPlans.Ioskeley.weights.Thin]
shape = 100
menu = 100
css = 100

[buildPlans.Ioskeley.weights.Light]
shape = 300
menu = 300
css = 300

[buildPlans.Ioskeley.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.Ioskeley.weights.Medium]
shape = 500
menu = 500
css = 500

[buildPlans.Ioskeley.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.Ioskeley.weights.Heavy]
shape = 900
menu = 900
css = 900

# Width
[buildPlans.Ioskeley.widths.Condensed]
shape = 416
menu = 3
css = "condensed"

[buildPlans.Ioskeley.widths.Normal]
shape = 500
menu = 5
css = "normal"

# Slopes
[buildPlans.Ioskeley.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.Ioskeley.slopes.Oblique]
angle = 9.4
shape = "oblique"
menu = "oblique"
css = "oblique"

# Metrics
[buildPlans.Ioskeley.metricOverride]
ascender = 740
cap = 740
xHeight = 525
