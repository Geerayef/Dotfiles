[metadata]
name = "MFD Mono (Accessibility 5)"
author = "Derived from kungfusheep/mfd.nvim"
origin_url = "https://github.com/kungfusheep/mfd.nvim"

[colors]
foreground = "#D0D0D8"
background = "#08080C"
cursor_bg = "#F0F0FF"
cursor_border = "#F0F0FF"
cursor_fg = "#08080C"
selection_bg = "#1A1A22"
selection_fg = "#D0D0D8"
ansi = [
  "#08080C",
  "#727276",
  # "#85858A",
  "#FFF779",
  # "#97979D", ## String
  "#FFF779",
  "#AAAAB1", ## Dir
  "#BDBDC4",
  "#D0D0D8", ## Flag
  "#D0D0D8",
]
brights = [
  "#6A6A7A",
  "#D0D0D8",
  # "#D8D8E0",
  "#FFF779",
  "#DFDFE8", ## File
  "#E7E7EF", ## Dir
  "#EEEEF7",
  "#F6F6FF",
  "#F6F6FF",
]

[colors.tab_bar]
background = "#08080C"

[colors.tab_bar.active_tab]
bg_color = "#1A1A22"
fg_color = "#D0D0D8"

[colors.tab_bar.inactive_tab]
bg_color = "#08080C"
fg_color = "#636376"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#1A1A22"
fg_color = "#D0D0D8"

[colors.tab_bar.new_tab]
bg_color = "#08080C"
fg_color = "#636376"

[colors.tab_bar.new_tab_hover]
bg_color = "#1A1A22"
fg_color = "#D0D0D8"
