[metadata]
name = "MFD Flir (Accessibility 5)"
author = "Derived from kungfusheep/mfd.nvim"
origin_url = "https://github.com/kungfusheep/mfd.nvim"

[colors]
foreground = "#9E9E9E"
background = "#181818"
cursor_bg = "#AAAAAA"
cursor_border = "#AAAAAA"
cursor_fg = "#181818"
selection_bg = "#242424"
selection_fg = "#9E9E9E"
ansi = [
  "#181818",
  "#767676",
  # "#7E7E7E",
  "#FFF779",
  # "#868686", ## String
  "#FFF779",
  "#8E8E8E", ## Dir
  "#969696",
  "#9E9E9E", ## Flag
  "#9E9E9E",
]
brights = [
  "#6C6C6C",
  "#9E9E9E",
  # "#A0A0A0",
  "#FFF779",
  "#A3A3A3", ## File
  "#A5A5A5", ## Dir
  "#A8A8A8",
  "#AAAAAA",
  "#B1B1B1",
]

[colors.tab_bar]
background = "#181818"

[colors.tab_bar.active_tab]
bg_color = "#242424"
fg_color = "#9E9E9E"

[colors.tab_bar.inactive_tab]
bg_color = "#181818"
fg_color = "#6C6C6C"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#242424"
fg_color = "#9E9E9E"

[colors.tab_bar.new_tab]
bg_color = "#181818"
fg_color = "#6C6C6C"

[colors.tab_bar.new_tab_hover]
bg_color = "#242424"
fg_color = "#9E9E9E"
